    scope: "https://www.googleapis.com/auth/spreadsheets",

    iat: now

    name: "RSASSA-PKCS1-v1_5",
    hash: "SHA-256"
  }, false, ["sign"]);
  const sig = await crypto.subtle.sign("RSASSA-PKCS1-v1_5", key, new TextEncoder().encode(si));
  const jwt = `${si}.${btoa(String.fromCharCode(...new Uint8Array(sig))).replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_")}`;
  const r = await (await fetch("https://oauth2.googleapis.com/token", {
    method: "POST",
    headers: {

    },
    body: `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}`
  })).json();

async function setupSheets() {

  const needed = all.map(([n]) => n).filter(n => !existing.includes(n));
  if (needed.length) {
    const res = await (await gBatch(needed.map(t => ({
      addSheet: {
        properties: {
          title: t
        }
      }
    })))).json();
    (res.replies || []).forEach((r, i) => {
      if (r.addSheet) GIDS[needed[i]] = r.addSheet.properties.sheetId;
    });
  }
  for (const [sheet, cols] of all) {
    const d = await gGet(`${sheet}!1:1`);
    const cur = d.values && d.values[0] || [];

  }

function useRoute() {
  const [path, setPath] = useState(window.location.hash || "#/dashboard");
  useEffect(() => {
    const h = () => setPath(window.location.hash || "#/dashboard");
    window.addEventListener("hashchange", h);
    return () => window.removeEventListener("hashchange", h);
  }, []);
  const nav = useCallback(to => {
    window.location.hash = to;
  }, []);
  return {
    path,
    nav
  };
}
