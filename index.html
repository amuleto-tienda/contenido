// ── AUTH ──────────────────────────────────────────────────────────────────────
let _TK=null, _TKexp=0;
async function getToken(){
  if(_TK && Date.now()<_TKexp) return _TK;
  const enc = o => btoa(JSON.stringify(o)).replace(/=/g,"").replace(/\+/g,"-").replace(/\//g,"_");
  const now = Math.floor(Date.now()/1000);
  const si = `${enc({alg:"RS256",typ:"JWT"})}.${enc({iss:CLIENT_EMAIL,scope:"https://www.googleapis.com/auth/spreadsheets",aud:"https://oauth2.googleapis.com/token",exp:now+3600,iat:now})}`;
  const key = await crypto.subtle.importKey("pkcs8", Uint8Array.from(atob(PK), c=>c.charCodeAt(0)).buffer, {name:"RSASSA-PKCS1-v1_5",hash:"SHA-256"}, false, ["sign"]);
  const sig = await crypto.subtle.sign("RSASSA-PKCS1-v1_5", key, new TextEncoder().encode(si));
  const jwt = `${si}.${btoa(String.fromCharCode(...new Uint8Array(sig))).replace(/=/g,"").replace(/\+/g,"-").replace(/\//g,"_")}`;
  const r = await (await fetch("https://oauth2.googleapis.com/token", {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:`grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}`})).json();
  _TK = r.access_token; _TKexp = Date.now()+3500000;
  return _TK;
}
const API = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}`;
async function ah(){ return {Authorization:`Bearer ${await getToken()}`, "Content-Type":"application/json"}; }
const gGet = async (r, api=API) => (await fetch(`${api}/values/${encodeURIComponent(r)}`, {headers: await ah()})).json();
async function checkRes(p){
  const res = await p;
  if(!res.ok){
    let msg = res.statusText;
    try{ const j = await res.json(); msg = (j.error && j.error.message) || msg; }catch{}
    throw new Error(`(${res.status}) ${msg}`);
  }
  return res;
}
const gPut = async (r,v, api=API) => checkRes(fetch(`${api}/values/${encodeURIComponent(r)}?valueInputOption=RAW`, {method:"PUT", headers: await ah(), body: JSON.stringify({values:v})}));
const gPost = async (r,v, api=API) => checkRes(fetch(`${api}/values/${encodeURIComponent(r)}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, {method:"POST", headers: await ah(), body: JSON.stringify({values:v})}));
const gBatch = async (reqs, api=API) => checkRes(fetch(`${api}:batchUpdate`, {method:"POST", headers: await ah(), body: JSON.stringify({requests:reqs})}));

async function setupSheets(){
  const meta = await (await fetch(API, {headers: await ah()})).json();
  (meta.sheets||[]).forEach(s=>GIDS[s.properties.title]=s.properties.sheetId);
  const existing = (meta.sheets||[]).map(s=>s.properties.title);
  const all = [["Ideas",COL_IDEAS],["IdeasListas",COL_IDEASLISTAS],["Organico",COL_ORGANICO],["OrgEventos",COL_OREVENTOS],["PAnuncios",COL_PANUNCIOS],["PCampanas",COL_PCAMPANAS],["PConjuntos",COL_PCONJUNTOS],["PAsignaciones",COL_PASIGNACIONES],["PMetricas",COL_PMETRICAS],["NegocioProyectos",COL_NEGOCIO],["Config",COL_CONFIG],["Creativos",COL_EEOCREATIVOS],["Metricas",COL_EEOMETRICAS],["Conversiones",COL_EEOCONV]];
  const needed = all.map(([n])=>n).filter(n=>!existing.includes(n));
  if(needed.length){
    const res = await (await gBatch(needed.map(t=>({addSheet:{properties:{title:t}}})))).json();
    (res.replies||[]).forEach((r,i)=>{ if(r.addSheet) GIDS[needed[i]]=r.addSheet.properties.sheetId; });
  }
  for(const [sheet,cols] of all){
    const d = await gGet(`${sheet}!1:1`);
    const cur = d.values && d.values[0] || [];
    if(!cur.length){ await gPut(`${sheet}!A1`, [cols]); continue; }
    const needsRewrite = cols.some((c,i)=>cur[i]!==c) || cur.length < cols.length;
    if(needsRewrite){
      const totalCols = Math.max(cols.length, cur.length);
      const newRow = [...cols, ...Array(Math.max(0, cur.length-cols.length)).fill("")];
      await gPut(`${sheet}!A1:${nCol(totalCols)}1`, [newRow]);
    }
  }
}
async function loadCfg(){
  try{
    const d = await gGet("Config!A:B");
    const rows = (d.values||[]).slice(1);
    const map = {}; rows.forEach(r=>{ if(r[0]) map[r[0]]=r[1]; });
    const cfg = JSON.parse(JSON.stringify(DEFAULT_CFG));
    Object.keys(DEFAULT_CFG).forEach(k=>{ if(map[k]){ try{ cfg[k]=JSON.parse(map[k]); }catch{} } });

    if(!cfgLabels(cfg.redesOrganico).includes("Instagram + TikTok")) cfg.redesOrganico = JSON.parse(JSON.stringify(DEFAULT_CFG.redesOrganico));
    return cfg;
  }catch{ return JSON.parse(JSON.stringify(DEFAULT_CFG)); }
}

const nCol = n => { let s=""; while(n>0){ s=String.fromCharCode(64+(n%26||26))+s; n=Math.floor((n-1)/26); } return s; };
const genId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today = () => new Date().toISOString().split("T")[0];
const fmtD = d => d ? new Date(d+"T12:00:00").toLocaleDateString("es-AR") : "";
function fmtWeekRange(inicio, fin){
  if(!inicio) return "";
  if(!fin) return fmtD(inicio);
  const [iy,im,id] = inicio.split("-").map(Number);
  const [fy,fm,fd] = fin.split("-").map(Number);
  if(im===fm && iy===fy) return `${id} al ${fd}/${fm}`;
  return `${id}/${im} al ${fd}/${fm}`;
}
const toN = v => parseFloat(v) || 0;
const fmtMoney = v => "$" + Math.round(toN(v)).toLocaleString("es-AR");
function parseRows(data){
  const rows = data.values || [];
  if(rows.length<2) return [];
  const hdr = rows[0];
  return rows.slice(1).map((row,i)=>{
    const o = {_row:i+2};
    hdr.forEach((hh,j)=>{ o[hh]=(row[j]||"").toString().trim(); });
    try{ o._notas = o.Notas ? JSON.parse(o.Notas) : []; }catch{ o._notas=[]; }
    try{ o._etiquetas = o.Etiquetas ? JSON.parse(o.Etiquetas) : []; }catch{ o._etiquetas=[]; }
    try{ o._etapas = o.Etapas ? JSON.parse(o.Etapas) : []; }catch{ o._etapas=[]; }
    return o;
  });
}
function buildRow(cols, obj){
  return cols.map(k=>{
    if(k==="Notas") return JSON.stringify(obj._notas||[]);
    if(k==="Etiquetas") return JSON.stringify(obj._etiquetas||[]);
    if(k==="Etapas") return JSON.stringify(obj._etapas||[]);
    return obj[k] || "";
  });
}
async function deleteRow(sheet, rowIdx, api=API){
  const sid = GIDS[sheet];
  if(sid===undefined) throw new Error("Sheet no encontrado: "+sheet);
  await gBatch([{deleteDimension:{range:{sheetId:sid, dimension:"ROWS", startIndex:rowIdx-1, endIndex:rowIdx}}}], api);
}
async function updateCell(sheet, cols, rowIdx, colName, value, api=API){
  const idx = cols.indexOf(colName);
  if(idx<0) return;
  await gPut(`${sheet}!${nCol(idx+1)}${rowIdx}`, [[value]], api);
}

function isoWeeksBetween(a,b){
  if(!a||!b) return 0;
  const ms = new Date(b) - new Date(a);
  return Math.max(1, Math.round(ms/(7*86400000)));
}
function addDays(dateStr, days){
  if(!dateStr) return "";
  const d = new Date(dateStr+"T12:00:00");
  d.setDate(d.getDate()+days);
  return d.toISOString().split("T")[0];
}

// ── ROUTER ────────────────────────────────────────────────────────────────────
function useRoute(){
  const [path,setPath] = useState(window.location.hash || "#/dashboard");
  useEffect(()=>{ const on=()=>setPath(window.location.hash||"#/dashboard"); window.addEventListener("hashchange",on); return ()=>window.removeEventListener("hashchange",on); },[]);
  const nav = useCallback(to=>{ window.location.hash = to; },[]);
  return {path, nav};
}

// ── BRAND CONTEXT ─────────────────────────────────────────────────────────────
function useBrand(cfg){
  const marcas = cfgLabels(cfg.marcas);
  const [brand,setBrand] = useState(()=> localStorage.getItem("cg_brand") || marcas[0] || "Amuleto");
  useEffect(()=>{ if(!marcas.includes(brand) && marcas.length) setBrand(marcas[0]); },[cfg]);
  const set = b => { setBrand(b); localStorage.setItem("cg_brand", b); };
  return [brand, set, marcas];
}

  const isEEO = brand === "Emprender en Orden";
  const pautadoChildren = [
    {label: isEEO?"Creativos":"Anuncios", path:"#/pautado/anuncios"},
    {label:"Comparativa", path:"#/pautado/comparativa"}
  ];
  if(isEEO) pautadoChildren.push({label:"Conversiones", path:"#/pautado/conversiones"});
  pautadoChildren.push({label:"Resumen", path:"#/pautado/resumen"});
  return [
    {id:"dashboard", label:"Dashboard", icon:"⬡", path:"#/dashboard"},
    {id:"ideas", label:"Ideas", icon:"💡", path:"#/ideas"},
    {id:"organico", label:"Orgánico", icon:"📱", children:[{label:"Contenido", path:"#/organico/contenido"},{label:"Calendario", path:"#/organico/calendario"}]},

function Ideas({cfg, brand, setSync, setErr}){
  const [listas,setListas] = useState([]);
  const [cards,setCards] = useState([]);
  const [ready,setReady] = useState(false);
  const [modalCard,setModalCard] = useState(null);
  const [dragCard,setDragCard] = useState(null);
  const [dragLista,setDragLista] = useState(null);
  const load = useCallback(async ()=>{
    try{
      const [dl, dc] = await Promise.all([gGet("IdeasListas!A:D"), gGet("Ideas!A:T")]);
      setListas(parseRows(dl)); setCards(parseRows(dc));
    }catch(e){ setErr("Error cargando Ideas: "+e.message); }
    setReady(true);
  },[]);
  useEffect(()=>{ load(); },[load]);
  const misListas = useMemo(()=> listas.filter(l=>l.Marca===brand).sort((a,b)=>toN(a.Orden)-toN(b.Orden)), [listas,brand]);
  const cardsByLista = useMemo(()=>{
    const m = {};
    cards.filter(c=>c.Marca===brand).forEach(c=>{ if(!m[c.Estado]) m[c.Estado]=[]; m[c.Estado].push(c); });
    Object.values(m).forEach(arr=>arr.sort((a,b)=>toN(a.Orden)-toN(b.Orden)));
    return m;
  },[cards,brand]);
  const addLista = async () => {
    const t = prompt("Título de la lista");
    if(!t) return;
    setSync("saving");
    try{
      const orden = misListas.length ? Math.max(...misListas.map(l=>toN(l.Orden)))+1 : 0;
      const obj = {ID:genId(), Marca:brand, Titulo:t, Orden:orden};
      await gPost("IdeasListas!A:D", [buildRow(COL_IDEASLISTAS, obj)]);
      await load(); setSync("saved"); setTimeout(()=>setSync("idle"),1500);
    }catch(e){ setErr("Error: "+e.message); setSync("error"); }
  };
  const renameLista = async (lista) => {
    const t = prompt("Nuevo título", lista.Titulo);
    if(!t) return;
    setSync("saving");
    try{ await updateCell("IdeasListas", COL_IDEASLISTAS, lista._row, "Titulo", t); await load(); setSync("saved"); setTimeout(()=>setSync("idle"),1500); }
    catch(e){ setErr("Error: "+e.message); setSync("error"); }
  };
  const delLista = async (lista) => {
    const cs = cardsByLista[lista.ID] || [];
    if(!confirm(`Eliminar la lista "${lista.Titulo}"${cs.length? ` y sus ${cs.length} tarjetas`:""}?`)) return;
    setSync("saving");
    try{
      for(const c of [...cs].sort((a,b)=>b._row-a._row)) await deleteRow("Ideas", c._row);
      await deleteRow("IdeasListas", lista._row);
      await load(); setSync("saved"); setTimeout(()=>setSync("idle"),1500);
    }catch(e){ setErr("Error: "+e.message); setSync("error"); }
  };
  const saveCard = async (d) => {
    setSync("saving");
    try{
      if(d._row){ await gPut(`Ideas!A${d._row}:T${d._row}`, [buildRow(COL_IDEAS,d)]); }
      else{
        const cs = cardsByLista[d.Estado] || [];
        const orden = cs.length ? Math.max(...cs.map(c=>toN(c.Orden)))+1 : 0;
        await gPost("Ideas!A:T", [buildRow(COL_IDEAS,{...d, ID:genId(), Marca:brand, Fecha:d.Fecha||today(), Orden:orden})]);
      }
      await load(); setSync("saved"); setTimeout(()=>setSync("idle"),1500);
    }catch(e){ setErr("Error: "+e.message); setSync("error"); }
  };
  const deleteCard = async (d) => {
    setSync("saving");
    try{ await deleteRow("Ideas", d._row); await load(); setSync("saved"); setTimeout(()=>setSync("idle"),1500); }
    catch(e){ setErr("Error: "+e.message); setSync("error"); }
  };
  const moveLista = async (target) => {
    if(!dragLista || dragLista.ID===target.ID) return;
    const dl = dragLista; setDragLista(null);
    const arr = misListas.filter(l=>l.ID!==dl.ID);
    const idx = arr.findIndex(l=>l.ID===target.ID);
    arr.splice(idx, 0, dl);
    setSync("saving");
    try{
      for(let i=0;i<arr.length;i++){ await updateCell("IdeasListas", COL_IDEASLISTAS, arr[i]._row, "Orden", i); }
      await load(); setSync("saved"); setTimeout(()=>setSync("idle"),1500);
    }catch(e){ setErr("Error: "+e.message); setSync("error"); }
  };
  const dropCardOn = async (lista) => {
    if(!dragCard) return;
    const card = dragCard; setDragCard(null);
    if(card.Estado===lista.ID) return;
    setSync("saving");
    try{
      const cs = cardsByLista[lista.ID] || [];
      const orden = cs.length ? Math.max(...cs.map(c=>toN(c.Orden)))+1 : 0;
      await updateCell("Ideas", COL_IDEAS, card._row, "Estado", lista.ID);
      await updateCell("Ideas", COL_IDEAS, card._row, "Orden", orden);
      await load(); setSync("saved"); setTimeout(()=>setSync("idle"),1500);
    }catch(e){ setErr("Error: "+e.message); setSync("error"); }
  };
  const onColumnDrop = (lista) => { if(dragLista) moveLista(lista); else if(dragCard) dropCardOn(lista); };
  if(!ready) return h(Spinner);
  return h("div", {className:"pu"},
    h(PageHdr, {title:"Ideas", sub:`Tablero de ${brand} — arrastrá las tarjetas entre listas, o arrastrá una lista por su título para reordenarla`}),
    h("div", {style:{display:"flex", gap:12, overflowX:"auto", paddingBottom:12}},
      misListas.map(lista=> h("div", {key:lista.ID, onDragOver:e=>e.preventDefault(), onDrop:()=>onColumnDrop(lista), style:{width:250, flexShrink:0, background: dragLista&&dragLista.ID===lista.ID?"rgba(124,58,237,0.1)":"rgba(255,255,255,0.4)", borderRadius:14, padding:10, border:"1px solid rgba(180,160,255,0.2)"}},
        h("div", {draggable:true, onDragStart:e=>{ e.stopPropagation(); setDragLista(lista); }, style:{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8, padding:"2px 4px", cursor:"grab"}},
          h("span", {style:{fontWeight:700, fontSize:13, color:"#1e1340"}, onClick:()=>renameLista(lista)}, lista.Titulo, " · ", (cardsByLista[lista.ID]||[]).length),
          h("button", {onClick:()=>delLista(lista), style:{background:"none", border:"none", cursor:"pointer", color:"#9b8fc0", fontSize:14}}, "×")),
        (cardsByLista[lista.ID]||[]).map(c=> h("div", {key:c.ID, draggable:true, onDragStart:e=>{ e.stopPropagation(); setDragCard(c); }, onClick:()=>setModalCard(c),
          style:{background:"rgba(255,255,255,0.75)", borderRadius:10, padding:"9px 11px", marginBottom:8, cursor:"pointer", borderLeft:`4px solid ${c.Color||"#a78bfa"}`, boxShadow:"0 1px 4px rgba(120,80,200,0.1)"}},
          c._etiquetas && c._etiquetas.length>0 && h("div", {style:{display:"flex", gap:4, flexWrap:"wrap", marginBottom:5}}, c._etiquetas.map((t,i)=>h(Badge,{key:i,label:t}))),
          h("p", {style:{fontSize:13, color:"#1e1340"}}, c.Titulo))),
        h(Btn, {sm:true, onClick:()=>setModalCard({Estado:lista.ID, _notas:[], _etiquetas:[]}), style:{width:"100%", justifyContent:"center", marginTop:4}}, "+ Añadir tarjeta"))),
      h("div", {style:{width:220, flexShrink:0}}, h(Btn, {onClick:addLista, style:{width:"100%", justifyContent:"center", border:"1px dashed rgba(120,80,200,0.3)", background:"transparent"}}, "+ Añadir lista"))),
    modalCard && h(IdeaCardModal, {card:modalCard, cfg, onClose:()=>setModalCard(null), onSave:saveCard, onDelete:()=>deleteCard(modalCard)}));
}

function useOrganico(brand, setSync, setErr){
  const [items,setItems] = useState([]);
  const [ready,setReady] = useState(false);
  const load = useCallback(async ()=>{
    try{ const d = await gGet("Organico!A:X"); setItems(parseRows(d)); }
    catch(e){ setErr("Error cargando Orgánico: "+e.message); }
    setReady(true);
  },[]);
  useEffect(()=>{ load(); },[load]);
  const save = async d => {
    setSync("saving");
    try{
      if(d._row){ await gPut(`Organico!A${d._row}:X${d._row}`, [buildRow(COL_ORGANICO,d)]); }
      else{ await gPost("Organico!A:X", [buildRow(COL_ORGANICO,{...d, ID:genId(), Marca:brand})]); }
      await load(); setSync("saved"); setTimeout(()=>setSync("idle"),1500);
    }catch(e){ setErr("Error: "+e.message); setSync("error"); }
  };
  const del = async d => {
    setSync("saving");
    try{ await deleteRow("Organico", d._row); await load(); setSync("saved"); setTimeout(()=>setSync("idle"),1500); }
    catch(e){ setErr("Error: "+e.message); setSync("error"); }
  };
  return {items, ready, save, del};
}

function filterOrg(items, brand, f){
  return items.filter(it=>{
    if(it.Marca!==brand) return false;
    if(f.apto && it.AptoPauta!=="TRUE") return false;
    if(f.sinFecha && it["Fecha Subida"]) return false;
    if(f.sinFilmar && it.Estado!=="Sin filmar") return false;
    if(f.red && it["Red Social"]!==f.red) return false;
    if(f.estado && it.Estado!==f.estado) return false;
    if(f.desde && (!it["Fecha Subida"] || it["Fecha Subida"] < f.desde)) return false;
    if(f.hasta && (!it["Fecha Subida"] || it["Fecha Subida"] > f.hasta)) return false;
    return true;
  });
}

function OrgCalendario({cfg, brand, setSync, setErr}){
  const {items, ready, save, del} = useOrganico(brand, setSync, setErr);
  const [f,setF] = useState({apto:false, sinFecha:false, sinFilmar:false, red:"", estado:"", desde:"", hasta:""});
  const [modal,setModal] = useState(null);
  const [month,setMonth] = useState(()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; });
  const [eventos,setEventos] = useState([]);
  const [eventosReady,setEventosReady] = useState(false);
  const loadEventos = useCallback(async ()=>{
    try{ const d = await gGet("OrgEventos!A:F"); setEventos(parseRows(d)); }
    catch(e){ setErr("Error cargando eventos: "+e.message); }
    setEventosReady(true);
  },[]);
  useEffect(()=>{ loadEventos(); },[loadEventos]);
  const addEvento = async () => {
    const titulo = prompt("Título del evento (ej. Hot Sale)");
    if(!titulo) return;
    const desde = prompt("Fecha desde (AAAA-MM-DD)", today());
    if(!desde) return;
    const hasta = prompt("Fecha hasta (AAAA-MM-DD)", desde);
    if(!hasta) return;
    setSync("saving");
    try{
      const color = EVENT_COLORS[eventos.length % EVENT_COLORS.length];
      await gPost("OrgEventos!A:F", [buildRow(COL_OREVENTOS, {ID:genId(), Marca:brand, Titulo:titulo, FechaDesde:desde, FechaHasta:hasta, Color:color})]);
      await loadEventos(); setSync("saved"); setTimeout(()=>setSync("idle"),1500);
    }catch(e){ setErr("Error: "+e.message); setSync("error"); }
  };
  const delEvento = async (ev) => {
    if(!confirm(`¿Eliminar el evento "${ev.Titulo}"?`)) return;
    setSync("saving");
    try{ await deleteRow("OrgEventos", ev._row); await loadEventos(); setSync("saved"); setTimeout(()=>setSync("idle"),1500); }
    catch(e){ setErr("Error: "+e.message); setSync("error"); }
  };
  if(!ready || !eventosReady) return h(Spinner);
  const filtered = filterOrg(items, brand, f);
  const sinFecha = filtered.filter(it=>!it["Fecha Subida"]);
  const conFecha = filtered.filter(it=>it["Fecha Subida"] && it["Fecha Subida"].slice(0,7)===month);
  const [y,m] = month.split("-").map(Number);
  const first = new Date(y, m-1, 1);
  const daysInMonth = new Date(y, m, 0).getDate();
  const startWeekday = (first.getDay()+6)%7;
  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  const byDay = {};
  conFecha.forEach(it=>{ const day = it["Fecha Subida"].slice(8,10); if(!byDay[day]) byDay[day]=[]; byDay[day].push(it); });
  const misEventos = eventos.filter(ev=>ev.Marca===brand);
  const eventosByDay = {};
  misEventos.forEach(ev=>{
    if(!ev.FechaDesde || !ev.FechaHasta) return;
    const d0 = new Date(ev.FechaDesde+"T12:00:00"), d1 = new Date(ev.FechaHasta+"T12:00:00");
    for(let d=new Date(d0); d<=d1; d.setDate(d.getDate()+1)){
      const iso = d.toISOString().slice(0,10);
      if(iso.slice(0,7)!==month) continue;
      const day = iso.slice(8,10);
      if(!eventosByDay[day]) eventosByDay[day]=[];
      eventosByDay[day].push(ev);
    }
  });
  return h("div", {className:"pu"},
    h(PageHdr, {title:"Orgánico — Calendario", sub:brand, action:h("div",{style:{display:"flex",gap:8}},
      h(GI,{type:"month", value:month, onChange:e=>setMonth(e.target.value), style:{width:150}}),
      h(Btn, {onClick:addEvento}, "+ Evento"))}),
    h(OrgFiltros, {cfg, f, setF}),
    h("div", {style:{display:"flex", gap:10, marginBottom:14, flexWrap:"wrap", fontSize:11, color:"#7c6aaa"}},
      cfgLabels(cfg.redesOrganico).map(r=> h("span", {key:r, style:{display:"flex", alignItems:"center", gap:4}}, h("span",{style:{width:9,height:9,borderRadius:3,background:cfgColor(cfg.redesOrganico,r),display:"inline-block"}}), r))),
    sinFecha.length>0 && h("div", {style:{...G.card, marginBottom:16}},
      h("p", {style:{fontWeight:700, fontSize:13, marginBottom:8}}, "Sin fecha programada (", sinFecha.length, ")"),
      h("div", {style:{display:"flex", gap:8, flexWrap:"wrap"}}, sinFecha.map(it=> h("div", {key:it.ID, onClick:()=>setModal(it), style:{cursor:"pointer", background:"rgba(255,255,255,0.7)", borderRadius:8, padding:"6px 10px", fontSize:12}}, it.Titulo)))),
    h("div", {style:{display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:6}},
      ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(d=>h("div",{key:d, style:{fontSize:11, fontWeight:700, color:"#7c6aaa", textAlign:"center"}}, d)),
      cells.map((day,i)=> h("div", {key:i, style:{minHeight:90, background: day?"rgba(255,255,255,0.4)":"transparent", borderRadius:8, padding:6, border: day?"1px solid rgba(180,160,255,0.15)":"none"}},
        day && h("div", null,
          h("p", {style:{fontSize:11, color:"#9b8fc0", marginBottom:4}}, day),
          (eventosByDay[String(day).padStart(2,"0")]||[]).map(ev=> h("div", {key:ev.ID, onClick:()=>delEvento(ev), title:"Click para eliminar", style:{cursor:"pointer", fontSize:10, fontWeight:700, background:ev.Color, color:"#1e1340", borderRadius:5, padding:"2px 5px", marginBottom:3}}, ev.Titulo)),
          (byDay[String(day).padStart(2,"0")]||[]).map(it=> h("div", {key:it.ID, onClick:()=>setModal(it), style:{cursor:"pointer", fontSize:11, background:cfgColor(cfg.redesOrganico, it["Red Social"])+"33", borderLeft:`3px solid ${cfgColor(cfg.redesOrganico, it["Red Social"])}`, borderRadius:5, padding:"2px 5px", marginBottom:3}}, it.Titulo)))))),
    modal && h(OrgModal, {item:modal, cfg, onClose:()=>setModal(null), onSave:save, onDelete:()=>del(modal)}));
}

function PResumen({cfg, brand, setSync, setErr}){
  const [metricas,setMetricas] = useState([]);
  const [ready,setReady] = useState(false);
  const [rango,setRango] = useState("30");
  const load = useCallback(async ()=>{ setMetricas(await loadMetricas()); setReady(true); },[]);
  useEffect(()=>{ load(); },[load]);
  if(!ready) return h(Spinner);
  const isEEO = brand !== "Amuleto";
  const mine = metricas.filter(m=>m.Marca===brand);
  const rangoDias = {"7":7,"15":15,"30":30,"45":45,"todo":Infinity}[rango];
  const cutoff = rangoDias===Infinity ? null : new Date(Date.now() - rangoDias*86400000);
  const enRango = mine.filter(m=> !cutoff || new Date(m.SemanaInicio) >= cutoff);
  const porCod = {};
  enRango.forEach(m=>{ if(!porCod[m.Codigo]) porCod[m.Codigo]=[]; porCod[m.Codigo].push(m); });
  const codAgg = Object.keys(porCod).map(cod=>{
    const rs = porCod[cod];
    const ctrs = rs.map(x=>toN(x.CTR)).filter(v=>v>0);
    const costos = rs.map(x=> isEEO? toN(x.CostoPorResultado): toN(x.CostoPorCompra)).filter(v=>v>0);
    const rends = rs.map(x=> isEEO? toN(x.Resultados) : toN(x.ROAS)).filter(v=>v>0);
    return {
      cod, titulo: rs[rs.length-1].Anuncio,
      avgCTR: ctrs.length? ctrs.reduce((a,b)=>a+b,0)/ctrs.length : null,
      avgCosto: costos.length? costos.reduce((a,b)=>a+b,0)/costos.length : null,
      avgRend: rends.length? rends.reduce((a,b)=>a+b,0)/rends.length : null
    };
  });
  const top5CTR = codAgg.filter(x=>x.avgCTR!==null).sort((a,b)=>b.avgCTR-a.avgCTR).slice(0,5);
  const top5Costo = codAgg.filter(x=>x.avgCosto!==null).sort((a,b)=>a.avgCosto-b.avgCosto).slice(0,5);
  const top5Rend = codAgg.filter(x=>x.avgRend!==null).sort((a,b)=>b.avgRend-a.avgRend).slice(0,5);
  const porGrupo = {};
  mine.forEach(m=>{ const key = `${m.Codigo}|||${m.Campana}|||${m.Conjunto}`; if(!porGrupo[key]) porGrupo[key]=[]; porGrupo[key].push(m); });
  const gruposEnRango = Object.entries(porGrupo).filter(([k,rs])=> rs.some(r=> !cutoff || new Date(r.SemanaInicio)>=cutoff));
  const vidas = gruposEnRango.map(([k,rs])=>{
    const conGasto = rs.filter(r=>toN(r.Gasto)>0).slice().sort((a,b)=>a.SemanaInicio.localeCompare(b.SemanaInicio));
    if(!conGasto.length) return null;
    return isoWeeksBetween(conGasto[0].SemanaInicio, conGasto[conGasto.length-1].SemanaFin);
  }).filter(v=>v!==null);
  const vidaProm = vidas.length ? (vidas.reduce((a,b)=>a+b,0)/vidas.length) : null;
  const porConjunto = {};

    const avgRend = rends.length? rends.reduce((a,b)=>a+b,0)/rends.length : 0;
    return {campana, conjunto, avgRend, n:rends.length};
  });
  const porCampana = {};
  conjAgg.forEach(c=>{ if(!porCampana[c.campana]) porCampana[c.campana]=[]; porCampana[c.campana].push(c); });
  Object.values(porCampana).forEach(arr=>arr.sort((a,b)=>b.avgRend-a.avgRend));
  return h("div", {className:"pu"},

    h("div", {style:{display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))", gap:14, marginTop:14}},
      h("div", {style:G.card},
        h("p",{style:{fontWeight:700,fontSize:13,marginBottom:8}}, "Top 5 — mejor CTR"),
        top5CTR.length===0? h("p",{style:{fontSize:12,color:"#9b8fc0"}},"Sin datos en este período.") :
        h("table",{className:"gtbl"}, h("tbody",null, top5CTR.map(x=>h("tr",{key:x.cod}, h("td",null,h("b",null,x.cod)), h("td",null,x.titulo), h("td",null,x.avgCTR.toFixed(2)+"%")))))),
      h("div", {style:G.card},
        h("p",{style:{fontWeight:700,fontSize:13,marginBottom:8}}, isEEO?"Top 5 — menor costo por resultado":"Top 5 — menor costo por compra"),
        top5Costo.length===0? h("p",{style:{fontSize:12,color:"#9b8fc0"}},"Sin datos en este período.") :
        h("table",{className:"gtbl"}, h("tbody",null, top5Costo.map(x=>h("tr",{key:x.cod}, h("td",null,h("b",null,x.cod)), h("td",null,x.titulo), h("td",null,fmtMoney(x.avgCosto))))))),
      h("div", {style:G.card},
        h("p",{style:{fontWeight:700,fontSize:13,marginBottom:8}}, isEEO?"Top 5 — mejor resultado":"Top 5 — mejor ROAS"),

    h("div", {style:{...G.card, marginTop:14}},

      Object.keys(porCampana).length===0 ? h("p",{style:{fontSize:12,color:"#9b8fc0"}},"Sin datos en este período.") :

function parseXlsxAmuleto(rows){
  return rows.map(r=>{
    const nombre = r["Nombre del anuncio"] || "";
    const [codigo, ...rest] = nombre.split(" - ");
    return {
      codigo: (codigo||nombre).trim(), anuncio: (rest.join(" - ")||nombre).trim(),
      campana: r["Nombre de la campaña"]||"", conjunto: r["Nombre del conjunto de anuncios"]||"",
      semanaInicio: r["Inicio del informe"]||"", semanaFin: r["Fin del informe"]||"",
      gasto: toN(r["Importe gastado (ARS)"]), compras: toN(r["Compras"]),
      costoPorCompra: toN(r["Costo por compra (ARS)"]), roas: toN(r["ROAS de compras"]),
      ctr: toN(r["CTR (todos)"])
    };
  });
}
function parseXlsxEEO(rows){
  return rows.map(r=>{
    const nombre = r["Nombre del anuncio"] || "";
    const [codigo, ...rest] = nombre.split(" - ");
    return {
      codigo: (codigo||nombre).trim(), anuncio: (rest.join(" - ")||nombre).trim(),

      indicadorResultado: r["Indicador de resultado"]||"", costoPorResultado: toN(r["Costo por resultados"]),

    };
  });
}
function PComparativa({cfg, brand, setSync, setErr}){
  const [metricas,setMetricas] = useState([]);
  const [ready,setReady] = useState(false);
  const [rango,setRango] = useState("todo");
  const [orden,setOrden] = useState("alfabetico");
  const fileRef = useRef(null);
  const load = useCallback(async ()=>{ setMetricas(await loadMetricas()); setReady(true); },[]);
  useEffect(()=>{ load(); },[load]);
  const isEEO = brand !== "Amuleto";
  const onFile = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    setSync("saving");
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:""});
      const parsed = isEEO ? parseXlsxEEO(rows) : parseXlsxAmuleto(rows);
      const toWrite = parsed.filter(p=>p.codigo).map(p=> buildRow(COL_PMETRICAS, {
        ID: genId(), Marca: brand, Codigo: p.codigo, Anuncio: p.anuncio, Campana: p.campana, Conjunto: p.conjunto,
        SemanaInicio: p.semanaInicio, SemanaFin: p.semanaFin, Gasto: p.gasto,
        Compras: p.compras||"", CostoPorCompra: p.costoPorCompra||"", ROAS: p.roas||"",
        Resultados: p.resultados||"", IndicadorResultado: p.indicadorResultado||"", CostoPorResultado: p.costoPorResultado||"",
        SeguidoresIG: p.seguidoresIG||"", CTR: p.ctr||""
      }));
      if(toWrite.length){
        await gPost("PMetricas!A:Q", toWrite);
        await load(); setSync("saved"); setTimeout(()=>setSync("idle"),1500);
      } else {
        setErr(`No se reconoció ninguna fila del archivo (leí ${rows.length} filas, 0 con código de anuncio válido). Revisá que el archivo sea a nivel Anuncio y tenga la columna "Nombre del anuncio".`);
        setSync("error");
      }
    }catch(err){ setErr("Error leyendo el archivo: "+err.message); setSync("error"); }
    if(fileRef.current) fileRef.current.value = "";
  };
  if(!ready) return h(Spinner);
  const mine = metricas.filter(m=>m.Marca===brand);
  const semanas = [...new Set(mine.map(m=>m.SemanaInicio))].sort();
  const ultimaSemana = semanas.length ? semanas[semanas.length-1] : null;
  const rangoDias = {"7":7,"15":15,"30":30,"45":45,"todo":Infinity}[rango];
  const cutoff = rangoDias===Infinity ? null : new Date(Date.now() - rangoDias*86400000);
  const semanasVisibles = semanas.filter(s=> !cutoff || new Date(s) >= cutoff);
  const porGrupo = {};
  mine.forEach(m=>{
    const key = `${m.Codigo}|||${m.Campana}|||${m.Conjunto}`;
    if(!porGrupo[key]) porGrupo[key]=[];
    porGrupo[key].push(m);
  });
  const corte = (cfg.colorCortePauta && cfg.colorCortePauta[brand]) || 10000;
  let filas = Object.keys(porGrupo).map(key=>{
    const rs = porGrupo[key].slice().sort((a,b)=>a.SemanaInicio.localeCompare(b.SemanaInicio));
    const last = rs[rs.length-1];
    const cod = last.Codigo;
    const conGasto = rs.filter(r=>toN(r.Gasto)>0);
    const vida = conGasto.length ? isoWeeksBetween(conGasto[0].SemanaInicio, conGasto[conGasto.length-1].SemanaFin)+" sem" : "—";
    const mejorMetrica = isEEO ? toN(last.Resultados) : toN(last.ROAS);
    const ventas = isEEO ? toN(last.Resultados) : toN(last.Compras);
    const rowUltima = rs.find(x=>x.SemanaInicio===ultimaSemana);
    const activaUltima = !!(rowUltima && toN(rowUltima.Gasto)>0);
    return {key, cod, rs, last, vida, mejorMetrica, ventas, activaUltima};
  });
  if(orden==="mejor") filas.sort((a,b)=> (b.activaUltima-a.activaUltima) || (b.mejorMetrica-a.mejorMetrica));
  else if(orden==="ventas") filas.sort((a,b)=> (b.activaUltima-a.activaUltima) || (b.ventas-a.ventas));
  else filas.sort((a,b)=> (b.activaUltima-a.activaUltima) || a.last.Campana.localeCompare(b.last.Campana) || a.last.Conjunto.localeCompare(b.last.Conjunto) || a.cod.localeCompare(b.cod));
  const semanaFinPorInicio = {};
  mine.forEach(m=>{ if(!semanaFinPorInicio[m.SemanaInicio]) semanaFinPorInicio[m.SemanaInicio]=m.SemanaFin; });
  return h("div", {className:"pu"},
    h(PageHdr, {title:"Pautado — Comparativa", sub:brand, action:
      h("div", null,
        h("input", {type:"file", accept:".xlsx,.xls", ref:fileRef, style:{display:"none"}, onChange:onFile}),
        h(Btn, {primary:true, onClick:()=>fileRef.current.click()}, "Subir reporte semanal"))}),
    h("div", {style:{display:"flex", gap:8, marginBottom:10, flexWrap:"wrap"}},
      [["7","Últimos 7 días"],["15","Últimos 15 días"],["30","Últimos 30 días"],["45","Últimos 45 días"],["todo","Todo"]].map(([k,l])=>
        h(Chip,{key:k, label:l, on:rango===k, onClick:()=>setRango(k)}))),
    h("div", {style:{display:"flex", gap:8, marginBottom:14, flexWrap:"wrap", alignItems:"center"}},
      h("span", {style:{fontSize:11, color:"#7c6aaa"}}, "Ordenar por:"),
      h(Chip, {label:"Campaña / Conjunto", on:orden==="alfabetico", onClick:()=>setOrden("alfabetico")}),
      h(Chip, {label: isEEO?"Mejor resultado":"Mejor ROAS", on:orden==="mejor", onClick:()=>setOrden("mejor")}),
      h(Chip, {label: isEEO?"Más resultados":"Más ventas", on:orden==="ventas", onClick:()=>setOrden("ventas")}),
      h("span", {style:{fontSize:11, color:"#9b8fc0"}}, "· Sin gasto en el último reporte va al final")),
    filas.length===0 ? h("p", {style:{color:"#9b8fc0", fontSize:13}}, "Todavía no subiste ningún reporte semanal.") :
    h("div", {style:{overflowX:"auto"}}, h("table", {className:"gtbl"},
      h("thead", null, h("tr", null, h("th",null,"Campaña"), h("th",null,"Conjunto"), h("th",null,"Anuncio"), h("th",null,"Vida útil"), semanasVisibles.map(s=>h("th",{key:s}, fmtWeekRange(s, semanaFinPorInicio[s]))))),
      h("tbody", null, filas.map(({key, cod, rs, last, vida, activaUltima})=>
        h("tr", {key, style:{opacity: activaUltima?1:0.55}},
          h("td", null, last.Campana), h("td", null, last.Conjunto), h("td", null, h("b",null,cod), " - ", last.Anuncio),
          h("td", null, vida),
          semanasVisibles.map(s=>{
            const r = rs.find(x=>x.SemanaInicio===s);
            if(!r) return h("td",{key:s},"—");
            if(!isEEO){
              const sinVentas = toN(r.Compras)===0;
              const rojo = sinVentas && toN(r.CostoPorCompra)>corte;
              const verde = !sinVentas && toN(r.ROAS)>=3.5;
              const cpc = toN(r.CostoPorCompra)>0 ? fmtMoney(r.CostoPorCompra) : "—";
              return h("td", {key:s, style:{color: rojo?"#dc2626":verde?"#059669":undefined, fontWeight: (rojo||verde)?700:400}},
                sinVentas ? "Sin ventas" : `ROAS ${toN(r.ROAS).toFixed(1)}x`,
                h("div", {style:{fontSize:11, color: rojo?"#dc2626":verde?"#059669":"#9b8fc0", fontWeight:400}}, `CPC ${cpc} · ${fmtMoney(r.Gasto)}`));
            }
            return h("td", {key:s},
              `${Math.round(toN(r.Resultados))} ${r.IndicadorResultado?"("+r.IndicadorResultado.split(".").pop()+")":""}`,
              h("div", {style:{fontSize:11, color:"#9b8fc0"}}, `${Math.round(toN(r.SeguidoresIG))} seguidores IG · ${fmtMoney(r.Gasto)}`));
          })))))));
}

      const toWrite = parsed.filter(p=>p.numero).map(p=> buildRow(COL_EEOMETRICAS, {
        ID: genId(), Numero: p.numero, Anuncio: p.anuncio, Servicio: servicioByNum[p.numero]||"",
        Campana: p.campana, Conjunto: p.conjunto, SemanaInicio: p.semanaInicio, SemanaFin: p.semanaFin,
        Gasto: p.gasto, Resultados: p.resultados||"", CostoPorResultado: p.costoPorResultado||"", CTR: p.ctr||""
      }));
      if(toWrite.length){
        await gPost("Metricas!A:L", toWrite);
        await load(); setSync("saved"); setTimeout(()=>setSync("idle"),1500);
      } else {
        setErr(`No se reconoció ninguna fila del archivo (leí ${rows.length} filas, 0 con número de anuncio válido). Revisá que el archivo sea a nivel Anuncio y tenga la columna "Nombre del anuncio".`);
        setSync("error");
      }
    }catch(err){ setErr("Error leyendo el archivo: "+err.message); setSync("error"); }
    if(fileRef.current) fileRef.current.value = "";
  };
  if(!ready) return h(Spinner);
  const semanas = [...new Set(metricas.map(m=>m.SemanaInicio))].filter(Boolean).sort();
  const ultimaSemana = semanas.length ? semanas[semanas.length-1] : null;
  const rangoDias = {"7":7,"15":15,"30":30,"45":45,"todo":Infinity}[rango];
  const cutoff = rangoDias===Infinity ? null : new Date(Date.now() - rangoDias*86400000);
  const semanasVisibles = semanas.filter(s=> !cutoff || new Date(s) >= cutoff);
  const porGrupo = {};
  metricas.forEach(m=>{
    const key = `${m.Numero}|||${m.Campana}|||${m.Conjunto}`;
    if(!porGrupo[key]) porGrupo[key]=[];
    porGrupo[key].push(m);
  });
  let filas = Object.keys(porGrupo).map(key=>{
    const rs = porGrupo[key].slice().sort((a,b)=>a.SemanaInicio.localeCompare(b.SemanaInicio));
    const last = rs[rs.length-1];
    const rowUltima = rs.find(x=>x.SemanaInicio===ultimaSemana);
    const activaUltima = !!(rowUltima && toN(rowUltima.Gasto)>0);
    return {key, rs, last, activaUltima};
  });
  filas.sort((a,b)=> (b.activaUltima-a.activaUltima) || a.last.Campana.localeCompare(b.last.Campana) || a.last.Conjunto.localeCompare(b.last.Conjunto) || a.last.Numero.localeCompare(b.last.Numero));
  const semanaFinPorInicio = {};
  metricas.forEach(m=>{ if(!semanaFinPorInicio[m.SemanaInicio]) semanaFinPorInicio[m.SemanaInicio]=m.SemanaFin; });
  return h("div", {className:"pu"},
    h(PageHdr, {title:"Pautado — Comparativa", sub:brand, action:
      h("div", null,
        h("input", {type:"file", accept:".xlsx,.xls", ref:fileRef, style:{display:"none"}, onChange:onFile}),
        h(Btn, {primary:true, onClick:()=>fileRef.current.click()}, "Subir reporte semanal"))}),
    h("div", {style:{display:"flex", gap:8, marginBottom:14, flexWrap:"wrap"}},
      [["7","Últimos 7 días"],["15","Últimos 15 días"],["30","Últimos 30 días"],["45","Últimos 45 días"],["todo","Todo"]].map(([k,l])=>
        h(Chip,{key:k, label:l, on:rango===k, onClick:()=>setRango(k)}))),
    filas.length===0 ? h("p", {style:{color:"#9b8fc0", fontSize:13}}, "Todavía no subiste ningún reporte semanal.") :
    h("div", {style:{overflowX:"auto"}}, h("table", {className:"gtbl"},
      h("thead", null, h("tr", null, h("th",null,"Servicio"), h("th",null,"Campaña"), h("th",null,"Conjunto"), h("th",null,"Ad"), semanasVisibles.map(s=>h("th",{key:s}, fmtWeekRange(s, semanaFinPorInicio[s]))))),
      h("tbody", null, filas.map(({key, rs, last, activaUltima})=>{
        const serv = servicioByNum[last.Numero] || last.Servicio || "";
        return h("tr", {key, style:{opacity: activaUltima?1:0.55}},
          h("td", null, serv ? h(Badge,{label:serv, color:SERV_BADGE_BG[serv]}) : "—"),
          h("td", null, last.Campana), h("td", null, last.Conjunto),
          h("td", null, h("b",null,last.Numero), " - ", last.Anuncio),
          semanasVisibles.map(s=>{
            const r = rs.find(x=>x.SemanaInicio===s);
            if(!r) return h("td",{key:s},"—");
            const cpr = toN(r.CostoPorResultado);
            return h("td", {key:s},
              `${Math.round(toN(r.Resultados))} · CPA ${cpr>0?fmtMoney(cpr):"—"}`,
              h("div", {style:{fontSize:11, color:"#9b8fc0"}}, fmtMoney(r.Gasto)+" total"));
          }));
      })))));
}

// ── PAUTADO EMPRENDER EN ORDEN — CONVERSIONES (carga manual) ───────────────────
function EEOConversiones({cfg, brand, setSync, setErr}){
  const [rows,setRows] = useState([]);
  const [draft,setDraft] = useState({});
  const [ready,setReady] = useState(false);
  const load = useCallback(async ()=>{
    try{
      const d = await loadEEOConv(); setRows(d);
      const dr={}; d.forEach(r=>{ dr[r.ID]={SuscripcionesGEO:r.SuscripcionesGEO||"", AsesoriasAgendadas:r.AsesoriasAgendadas||""}; });
      setDraft(dr);
    }catch(e){ setErr("Error cargando Conversiones: "+e.message); }
    setReady(true);
  },[]);
  useEffect(()=>{ load(); },[load]);
  const hasChanges = r => {
    const d = draft[r.ID]||{};
    return (d.SuscripcionesGEO??"")!==(r.SuscripcionesGEO||"") || (d.AsesoriasAgendadas??"")!==(r.AsesoriasAgendadas||"");
  };
  const saveRow = async r => {
    setSync("saving");
    try{
      const d = draft[r.ID]||{};
      const updated = {...r, SuscripcionesGEO:d.SuscripcionesGEO??"", AsesoriasAgendadas:d.AsesoriasAgendadas??""};
      await gPut(`Conversiones!A${r._row}:E${r._row}`, [buildRow(COL_EEOCONV, updated)]);
      await load(); setSync("saved"); setTimeout(()=>setSync("idle"),1500);
    }catch(e){ setErr("Error guardando la semana: "+e.message); setSync("error"); }
  };
  const addSemana = async () => {
    const inicio = prompt("Lunes de inicio de la semana (AAAA-MM-DD)");
    if(!inicio) return;
    const fin = addDays(inicio, 6);
    setSync("saving");
    try{
      await gPost("Conversiones!A:E", [buildRow(COL_EEOCONV,{ID:genId(), SemanaInicio:inicio, SemanaFin:fin, SuscripcionesGEO:"", AsesoriasAgendadas:""})]);
      await load(); setSync("saved"); setTimeout(()=>setSync("idle"),1500);
    }catch(e){ setErr("Error: "+e.message); setSync("error"); }
  };
  if(!ready) return h(Spinner);
  const ordered = rows.slice().sort((a,b)=>a.SemanaInicio.localeCompare(b.SemanaInicio));
  return h("div", {className:"pu"},
    h(PageHdr, {title:"Pautado — Conversiones", sub:brand+" · esto se carga a mano cada semana", action:h(Btn,{primary:true, onClick:addSemana}, "+ Agregar semana")}),
    h("p", {style:{fontSize:11.5, color:"#9b8fc0", marginBottom:10}}, `${rows.length} semana(s) cargada(s) en esta pestaña.`),
    h("div", {style:{overflowX:"auto"}}, h("table", {className:"gtbl"},
      h("thead", null, h("tr", null, h("th",null,"Semana"), h("th",null,"Suscripciones nuevas — Gestión en Orden"), h("th",null,"Asesorías agendadas"), h("th",null,""))),
      h("tbody", null, ordered.length===0 ? h("tr",null,h("td",{colSpan:4,style:{color:"#9b8fc0"}},"Todavía no cargaste ninguna semana.")) :
        ordered.map(r=> h("tr", {key:r.ID},
          h("td", null, fmtWeekRange(r.SemanaInicio, r.SemanaFin)),
          h("td", null, h(GI, {value: draft[r.ID]?.SuscripcionesGEO ?? "", onChange:e=>setDraft(dd=>({...dd,[r.ID]:{...dd[r.ID], SuscripcionesGEO:e.target.value}})), style:{width:90}})),
          h("td", null, h(GI, {value: draft[r.ID]?.AsesoriasAgendadas ?? "", onChange:e=>setDraft(dd=>({...dd,[r.ID]:{...dd[r.ID], AsesoriasAgendadas:e.target.value}})), style:{width:90}})),
          h("td", null, hasChanges(r) ? h(Btn,{sm:true, primary:true, onClick:()=>saveRow(r)}, "Guardar") : h("span",{style:{fontSize:11,color:"#9b8fc0"}}, "✓ guardado")))))),
    h("p", {style:{fontSize:11.5, color:"#9b8fc0", marginTop:10}}, "En Resumen: las suscripciones de una semana se cruzan con los registros de dos semanas antes (delay de 15 días). Las asesorías agendadas se cruzan con los chats de esa misma semana.")));
}

// ── PAUTADO EMPRENDER EN ORDEN — RESUMEN ───────────────────────────────────────
function EEOResumen({cfg, brand, setSync, setErr, setCfg}){
  const [metricas,setMetricas] = useState([]);
  const [creativos,setCreativos] = useState([]);
  const [conv,setConv] = useState([]);
  const [ready,setReady] = useState(false);
  const [rango,setRango] = useState("todo");
  const [asesInput,setAsesInput] = useState("");
  const load = useCallback(async ()=>{
    try{
      const [mt,cr,cv] = await Promise.all([loadEEOMetricas(), loadEEOCreativos(), loadEEOConv()]);
      setMetricas(mt); setCreativos(cr); setConv(cv);
    }catch(e){ setErr("Error cargando Resumen: "+e.message); }
    setReady(true);
  },[]);
  useEffect(()=>{ load(); },[load]);
  const saveObjetivos = async patch => {
    const next = {...cfg, ...patch};
    setSync("saving");
    try{ await saveCfg(next); setCfg(next); setSync("saved"); setTimeout(()=>setSync("idle"),1500); }
    catch(e){ setErr("Error: "+e.message); setSync("error"); }
  };
  const servicioByNum = useMemo(()=>{
    const m = {}; creativos.forEach(c=>{ m[c.Numero]=c.Servicio||""; }); return m;
  },[creativos]);
  const porServicioSemana = useMemo(()=>{
    const m = {};
    metricas.forEach(x=>{
      const s = servicioByNum[x.Numero] || x.Servicio || "Sin servicio";
      if(!m[s]) m[s]={};
      if(!m[s][x.SemanaInicio]) m[s][x.SemanaInicio]={gasto:0, resultados:0, semanaFin:x.SemanaFin};
      m[s][x.SemanaInicio].gasto += toN(x.Gasto);
      m[s][x.SemanaInicio].resultados += toN(x.Resultados);
    });
    return m;
  },[metricas, servicioByNum]);
  const convBySemana = useMemo(()=>{
    const m = {};
    conv.forEach(c=>{ m[c.SemanaInicio] = {suscripciones: toN(c.SuscripcionesGEO), suscripcionesRaw:c.SuscripcionesGEO, agendas: toN(c.AsesoriasAgendadas), agendasRaw:c.AsesoriasAgendadas}; });
    return m;
  },[conv]);
  if(!ready) return h(Spinner);
  const rangoDias = {"7":7,"15":15,"30":30,"45":45,"todo":Infinity}[rango];
  const cutoff = rangoDias===Infinity ? null : new Date(Date.now() - rangoDias*86400000);
  const buildTrend = (servicio, offsetDias, campo) => {
    const semanas = Object.keys(porServicioSemana[servicio]||{}).filter(s=> !cutoff || new Date(s)>=cutoff).sort();
    return semanas.map(s=>{
      const {gasto, resultados, semanaFin} = porServicioSemana[servicio][s];
      const matchSemana = addDays(s, offsetDias);
      const cRow = convBySemana[matchSemana];
      const raw = cRow ? (campo==="suscripciones"?cRow.suscripcionesRaw:cRow.agendasRaw) : "";
      const val = cRow ? (campo==="suscripciones"?cRow.suscripciones:cRow.agendas) : null;
      const tiene = raw!==undefined && raw!==null && raw!=="";
      return {
        semana:s, semanaFin, matchSemana, gasto, resultados,
        conv: tiene?val:null, pendiente: !tiene,
        pctConv: tiene && resultados>0 ? val/resultados : null,
        costo: tiene && val>0 ? gasto/val : null
      };
    });
  };
  const geoTrend = buildTrend("Gestión en Orden", 14, "suscripciones");
  const asesTrend = buildTrend("Asesoría", 0, "agendas");
  const totalize = trend => {
    const cerradas = trend.filter(t=>!t.pendiente);
    const gasto = trend.reduce((a,t)=>a+t.gasto,0);
    const resultados = trend.reduce((a,t)=>a+t.resultados,0);
    const resultadosCerradas = cerradas.reduce((a,t)=>a+t.resultados,0);
    const conversiones = cerradas.reduce((a,t)=>a+(t.conv||0),0);
    const gastoCerradas = cerradas.reduce((a,t)=>a+t.gasto,0);
    return {
      gasto, resultados, conversiones,
      cpa: resultados>0 ? gasto/resultados : null,
      pctConv: resultadosCerradas>0 ? conversiones/resultadosCerradas : null,
      costoConv: conversiones>0 ? gastoCerradas/conversiones : null
    };
  };
  const geoTot = totalize(geoTrend);
  const asesTot = totalize(asesTrend);
  const badgeFor = st => {
    if(st==="ok") return h(Badge,{label:"Escalar", color:"rgba(5,150,105,0.15)"});
    if(st==="bad") return h(Badge,{label:"Bajar", color:"rgba(220,38,38,0.12)"});
    if(st==="sinobj") return h(Badge,{label:"Sin objetivo", color:"rgba(251,191,36,0.2)"});
    return h(Badge,{label:"Pendiente", color:"rgba(148,163,184,0.18)"});
  };
  const geoSt = t => t.pendiente ? "pend" : (t.pctConv>=cfg.geoObjetivoConversion && t.costo<=cfg.geoObjetivoCAC) ? "ok" : "bad";
  const asesSt = t => t.pendiente ? "pend" : cfg.asesoriaObjetivoCostoAgenda==null ? "sinobj" : (t.costo<=cfg.asesoriaObjetivoCostoAgenda ? "ok" : "bad");
  return h("div", {className:"pu"},
    h(PageHdr, {title:"Pautado — Resumen", sub:brand}),
    h("p", {style:{fontSize:11.5, color:"#9b8fc0", marginBottom:14}},
      `Leyendo: ${metricas.length} fila(s) de Comparativa · ${creativos.length} creativo(s) · ${conv.length} semana(s) de Conversiones cargadas.`),
    h("div", {style:{display:"flex", gap:8, marginBottom:18, flexWrap:"wrap"}},
      [["7","Últimos 7 días"],["15","Últimos 15 días"],["30","Últimos 30 días"],["45","Últimos 45 días"],["todo","Todo"]].map(([k,l])=>
        h(Chip,{key:k, label:l, on:rango===k, onClick:()=>setRango(k)}))),
    h("div", {style:{display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(360px,1fr))", gap:16}},
      h("div", {style:G.card},
        h("p", {style:{fontWeight:700, fontSize:14, marginBottom:2}}, "Gestión en Orden"),
        h("p", {style:{fontSize:11, color:"#9b8fc0", marginBottom:10}}, "Registros de la semana X vs. suscriptores cargados en la semana X+2"),
        h("div", {style:{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:6, marginBottom:12}},
          h(Field,{label:"CPA objetivo"}, h(GI,{type:"number", value:cfg.geoObjetivoCPA, onChange:e=>saveObjetivos({geoObjetivoCPA:toN(e.target.value)})})),
          h(Field,{label:"Conversión mín. (%)"}, h(GI,{type:"number", value:cfg.geoObjetivoConversion*100, onChange:e=>saveObjetivos({geoObjetivoConversion:toN(e.target.value)/100})})),
          h(Field,{label:"CAC máximo"}, h(GI,{type:"number", value:cfg.geoObjetivoCAC, onChange:e=>saveObjetivos({geoObjetivoCAC:toN(e.target.value)})}))),
        h("div", {style:{fontSize:13}},
          h("div", {className:"stat-row"}, h("span",null,"Gasto del período"), h("b",null,fmtMoney(geoTot.gasto))),
          h("div", {className:"stat-row"}, h("span",null,"Registros"), h("b",null,Math.round(geoTot.resultados))),
          h("div", {className:"stat-row"}, h("span",null,"Suscriptores (con delay ya aplicado)"), h("b",null,geoTot.conversiones)),
          h("div", {className:"stat-row"}, h("span",null,"CPA por registro"), h("b",null,geoTot.cpa!==null?fmtMoney(geoTot.cpa):"—")),
          h("div", {className:"stat-row"}, h("span",null,"% Conversión"), h("b",null,geoTot.pctConv!==null?(geoTot.pctConv*100).toFixed(1)+"%":"—")),
          h("div", {className:"stat-row"}, h("span",null,"CAC real"), h("b",null,geoTot.costoConv!==null?fmtMoney(geoTot.costoConv):"—"))),
        h("div", {style:{overflowX:"auto", marginTop:12}}, h("table", {className:"gtbl"},
          h("thead",null,h("tr",null,h("th",null,"Registros"),h("th",null,"Suscriptores"),h("th",null,"Conversión"),h("th",null,"CAC"),h("th",null,""))),
          h("tbody",null, geoTrend.length===0 ? h("tr",null,h("td",{colSpan:5,style:{color:"#9b8fc0"}},"Sin datos en este período.")) :
            geoTrend.map(t=>h("tr",{key:t.semana},
              h("td",null,fmtWeekRange(t.semana,t.semanaFin)),
              h("td",null, fmtWeekRange(t.matchSemana, addDays(t.matchSemana,6))),
              h("td",null, t.pctConv!==null?(t.pctConv*100).toFixed(1)+"%":"—"),
              h("td",null, t.costo!==null?fmtMoney(t.costo):"—"),
              h("td",null, badgeFor(geoSt(t)))))))) ),
      h("div", {style:G.card},
        h("p", {style:{fontWeight:700, fontSize:14, marginBottom:2}}, "Asesoría"),
        h("p", {style:{fontSize:11, color:"#9b8fc0", marginBottom:10}}, "Chats y agendas se comparan dentro de la misma semana"),
        h("div", {style:{display:"flex", gap:6, alignItems:"flex-end", marginBottom:12}},
          h(Field,{label:"Costo máximo por agenda ($, opcional)"}, h(GI,{type:"number", value:asesInput, onChange:e=>setAsesInput(e.target.value), placeholder: cfg.asesoriaObjetivoCostoAgenda ?? "Sin definir"})),
          h(Btn, {sm:true, onClick:()=>{ if(asesInput!=="") saveObjetivos({asesoriaObjetivoCostoAgenda:toN(asesInput)}); }}, "Guardar")),
        h("div", {style:{fontSize:13}},
          h("div", {className:"stat-row"}, h("span",null,"Gasto del período"), h("b",null,fmtMoney(asesTot.gasto))),
          h("div", {className:"stat-row"}, h("span",null,"Chats iniciados"), h("b",null,Math.round(asesTot.resultados))),
          h("div", {className:"stat-row"}, h("span",null,"Agendas"), h("b",null,asesTot.conversiones)),
          h("div", {className:"stat-row"}, h("span",null,"CPA por chat"), h("b",null,asesTot.cpa!==null?fmtMoney(asesTot.cpa):"—")),
          h("div", {className:"stat-row"}, h("span",null,"% que agenda"), h("b",null,asesTot.pctConv!==null?(asesTot.pctConv*100).toFixed(1)+"%":"—")),
          h("div", {className:"stat-row"}, h("span",null,"Costo por agenda"), h("b",null,asesTot.costoConv!==null?fmtMoney(asesTot.costoConv):"—"))),
        h("div", {style:{overflowX:"auto", marginTop:12}}, h("table", {className:"gtbl"},
          h("thead",null,h("tr",null,h("th",null,"Semana"),h("th",null,"% Agenda"),h("th",null,"Costo/agenda"),h("th",null,""))),
          h("tbody",null, asesTrend.length===0 ? h("tr",null,h("td",{colSpan:4,style:{color:"#9b8fc0"}},"Sin datos en este período.")) :
            asesTrend.map(t=>h("tr",{key:t.semana},
              h("td",null,fmtWeekRange(t.semana,t.semanaFin)),
              h("td",null, t.pctConv!==null?(t.pctConv*100).toFixed(1)+"%":"—"),
              h("td",null, t.costo!==null?fmtMoney(t.costo):"—"),
              h("td",null, badgeFor(asesSt(t)))))))))));
}

    setSync("saving");
    try{
      if(d._row){ await gPut(`NegocioProyectos!A${d._row}:G${d._row}`, [buildRow(COL_NEGOCIO,d)]); }
      else{ await gPost("NegocioProyectos!A:G", [buildRow(COL_NEGOCIO,{...d, ID:genId(), Marca:brand})]); }
      await load(); setSync("saved"); setTimeout(()=>setSync("idle"),1500);
    }catch(e){ setErr("Error: "+e.message); setSync("error"); }
  };
  const del = async d => {
    setSync("saving");
    try{ await deleteRow("NegocioProyectos", d._row); await load(); setSync("saved"); setTimeout(()=>setSync("idle"),1500); }
    catch(e){ setErr("Error: "+e.message); setSync("error"); }
  };
  if(!ready) return h(Spinner);
  const rows = items.filter(it=>it.Marca===brand);
  return h("div", {className:"pu"},
    h(PageHdr, {title:"Negocio", sub:brand, action:h(Btn,{primary:true, onClick:()=>setModal({_etapas:[]})}, "+ Nuevo proyecto")}),
    h("div", {style:{overflowX:"auto"}}, h("table", {className:"gtbl"},
      h("thead", null, h("tr", null, h("th",null,"Proyecto"), h("th",null,"Área"), h("th",null,"Fecha ideal de inicio"), h("th",null,"Etapa actual"))),
      h("tbody", null, rows.length===0 ? h("tr",null,h("td",{colSpan:4,style:{color:"#9b8fc0"}},"Todavía no cargaste proyectos.")) :
        rows.map(it=>{
          const etapas = it._etapas||[];
          const last = etapas[etapas.length-1];
          return h("tr", {key:it.ID, onClick:()=>setModal(it), style:{cursor:"pointer"}},
            h("td", null, it.Nombre), h("td", null, it.Area),
            h("td", null, it.FechaIdeal ? fmtD(it.FechaIdeal) : h(Badge,{label:"Sin definir"})),
            h("td", null, last ? h(Badge,{label:last.nombre, color:"rgba(124,58,237,0.12)"}) : h(Badge,{label:"Sin etapas"})));
        })))),
    modal && h(NegocioModal, {item:modal, onClose:()=>setModal(null), onSave:save, onDelete:()=>del(modal)}));
}
function Negocio({cfg, brand, setSync, setErr}){
  const [unlocked,setUnlocked] = useState(()=> !cfg.negocioPin || sessionStorage.getItem("cg_negocio_ok")==="1");
  const [pinIn,setPinIn] = useState("");
  const [pinErr,setPinErr] = useState(false);
  if(!unlocked){
    return h("div", {className:"pu", style:{maxWidth:320}},
      h(PageHdr, {title:"Negocio"}),
      h("p", {style:{fontSize:13, color:"#5b4d8a", marginBottom:10}}, "Esta sección tiene un PIN. Pedíselo a quien lo administra."),
      h(GI, {type:"password", value:pinIn, onChange:e=>{setPinIn(e.target.value); setPinErr(false);}, placeholder:"PIN"}),
      pinErr && h("p", {style:{color:"#dc2626", fontSize:12, marginTop:6}}, "PIN incorrecto."),
      h(Btn, {primary:true, style:{marginTop:10}, onClick:()=>{
        if(pinIn===cfg.negocioPin){ sessionStorage.setItem("cg_negocio_ok","1"); setUnlocked(true); } else setPinErr(true);
      }}, "Entrar"));
  }
  return h(NegocioContenido, {cfg, brand, setSync, setErr});
}

// ── CONFIG ────────────────────────────────────────────────────────────────────
function SI({value, idx, onUpd, onRem}){
  const isObj = typeof value==="object";
  return h("div", {style:{display:"flex", gap:6, marginBottom:6, alignItems:"center"}},
    isObj && h("input", {type:"color", value:value.color||"#a78bfa", onChange:e=>onUpd(idx,{...value,color:e.target.value}), style:{width:28, height:28, border:"none", borderRadius:6, cursor:"pointer"}}),
    h(GI, {value: isObj?value.label:value, onChange:e=>onUpd(idx, isObj?{...value,label:e.target.value}:e.target.value), style:{flex:1}}),
    h("button", {onClick:()=>onRem(idx), style:{background:"none", border:"none", cursor:"pointer", color:"#9b8fc0", fontSize:18, lineHeight:1}}, "×"));
}
function CL({title, items, onChange}){
  return h("div", {style:{marginBottom:16}}, h("p", {style:{fontWeight:600, fontSize:13, color:"#1e1340", marginBottom:8}}, title),
    (items||[]).map((it,i)=> h(SI, {key:i, value:it, idx:i, onUpd:(i,v)=>onChange((items||[]).map((x,j)=>j===i?v:x)), onRem:i=>onChange((items||[]).filter((_,j)=>j!==i))})),
    h(Btn, {onClick:()=>onChange([...(items||[]), {label:"Nuevo", color:"#a78bfa"}]), style:{fontSize:11, padding:"4px 10px", marginTop:4}}, "+ Agregar"));
}
function Config({cfg, setCfg, setSync, setErr}){
  const [draft,setDraft] = useState(JSON.parse(JSON.stringify(cfg)));
  const [sv,setSv] = useState(false);
  const doSave = async () => {
    setSync("saving");
    try{ await saveCfg(draft); setCfg(draft); setSync("saved"); setSv(true); setTimeout(()=>{setSync("idle"); setSv(false);},1500); }
    catch(e){ setErr("Error: "+e.message); setSync("error"); }
  };
  const secs = [["Marcas","marcas"],["Redes — Ideas","redesIdea"],["Redes — Orgánico","redesOrganico"],["Estados — Orgánico","estadosOrganico"],["Estados — Anuncios","estadosAnuncios"],["Estados — Campañas","estadosPautado"]];
  return h("div", {className:"pu"},
    h(PageHdr, {title:"Configuración", sub:"Personalizá etiquetas, colores y estados", action:h(Btn,{primary:true, onClick:doSave, style:{background: sv?"rgba(52,211,153,0.3)":"rgba(167,139,250,0.3)"}}, sv?"✓ Guardado":"Guardar cambios")}),
    h("div", {style:{display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))", gap:12}},
      secs.map(([title,key])=> h("div", {key, style:G.card}, h(CL, {title, items:draft[key]||[], onChange:v=>setDraft(d=>({...d,[key]:v}))}))),
      h("div", {style:G.card}, h(CL, {title:"Formatos", items:(draft.formatos||[]).map(f=>({label:f})), onChange:v=>setDraft(d=>({...d, formatos:v.map(x=>x.label||x)}))})),
      h("div", {style:G.card}, h(CL, {title:"Artículos / productos", items:(draft.articulos||[]).map(f=>({label:f})), onChange:v=>setDraft(d=>({...d, articulos:v.map(x=>x.label||x)}))})),
      h("div", {style:G.card}, h("p", {style:{fontWeight:600, fontSize:13, color:"#1e1340", marginBottom:8}}, "PIN de Negocio"),
        h("p", {style:{fontSize:11, color:"#9b8fc0", marginBottom:8}}, "Dejalo vacío para que no pida PIN. Es solo una traba simple, no seguridad real."),
        h(GI, {value:draft.negocioPin||"", onChange:e=>setDraft(d=>({...d, negocioPin:e.target.value})), placeholder:"Sin PIN"}))));
}

// ── APP ROOT ──────────────────────────────────────────────────────────────────
function App(){
  const {path, nav} = useRoute();
  const [cfg,setCfg] = useState(JSON.parse(JSON.stringify(DEFAULT_CFG)));
  const [brand, setBrand, marcas] = useBrand(cfg);
  const [sync,setSync] = useState("idle");
  const [err,setErr] = useState(null);
  const [sideOpen,setSideOpen] = useState(false);
  const [ready,setReady] = useState(false);
  useEffect(()=>{
    if(!window.location.hash || window.location.hash==="#") nav("#/dashboard");
    (async ()=>{
      try{ await setupSheets(); setCfg(await loadCfg()); }
      catch(e){ setErr("Error de inicio: "+e.message); }
      setReady(true);
    })();
  },[]);
  const sp = {cfg, brand, setSync, setErr, setCfg};
  const page = () => {
    if(!ready) return h("div", {style:{display:"flex", alignItems:"center", justifyContent:"center", height:"60vh"}}, h(Spinner));
    if(path==="#/dashboard") return h(Dashboard, {brand});
    if(path==="#/ideas") return h(Ideas, sp);
    if(path==="#/organico/contenido") return h(OrgContenido, sp);
    if(path==="#/organico/calendario") return h(OrgCalendario, sp);
    const isEEO = brand === "Emprender en Orden";
    if(path==="#/pautado/anuncios") return isEEO ? h(EEOCreativos, sp) : h(PAnuncios, sp);
    if(path==="#/pautado/resumen") return isEEO ? h(EEOResumen, sp) : h(PResumen, sp);
    if(path==="#/pautado/comparativa") return isEEO ? h(EEOComparativa, sp) : h(PComparativa, sp);
    if(path==="#/pautado/conversiones") return isEEO ? h(EEOConversiones, sp) : h(Dashboard, {brand});
    if(path==="#/negocio") return h(Negocio, sp);
    if(path==="#/config") return h(Config, {cfg, setCfg, setSync, setErr});
    return h(Dashboard, {brand});
  };
  return h("div", {style:{display:"flex", height:"100vh", overflow:"hidden"}},
    h(Sidebar, {path, nav, open:sideOpen, setOpen:setSideOpen, sync, cfg, brand, setBrand, marcas}),
    h("div", {id:"mc", style:{flex:1, marginLeft:220, overflowY:"auto", height:"100vh", transition:"margin 0.25s"}},
      h("div", {id:"mbar", style:{display:"none", position:"sticky", top:0, zIndex:30, background:"rgba(255,255,255,0.8)", backdropFilter:"blur(20px)", padding:"10px 16px", borderBottom:"1px solid rgba(180,160,255,0.2)", alignItems:"center", gap:10}},
        h("button", {onClick:()=>setSideOpen(o=>!o), style:{background:"rgba(120,80,200,0.1)", border:"1px solid rgba(120,80,200,0.2)", borderRadius:8, padding:"6px 10px", cursor:"pointer", color:"#1e1340", fontSize:16}}, "☰"),
        h("span", {style:{fontWeight:700, fontSize:14, color:"#1e1340", flex:1}}, "Gestión"),
        h(SyncBadge, {s:sync})),
      h("div", {style:{padding:"24px"}},
        err && h("div", {style:{background:"rgba(239,68,68,0.08)", border:"1px solid rgba(239,68,68,0.2)", borderRadius:10, padding:"10px 14px", color:"#dc2626", marginBottom:16, fontSize:13, display:"flex", justifyContent:"space-between", alignItems:"center"}},
          "⚠️ ", err, h("button", {onClick:()=>setErr(null), style:{background:"none", border:"none", cursor:"pointer", color:"#dc2626", fontWeight:700, fontSize:16}}, "×")),
        page())));
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h(App));
</script>
</body>
